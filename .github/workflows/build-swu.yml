name: Build SWU

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore cached build layers
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and export
      uses: docker/build-push-action@v7
      with:
        push: false
        context: .
        no-cache: ${{ inputs.clean_build }}
        build-args: version=${{ github.sha }}
        outputs: type=local,dest=./build/dist
        cache-from: type=gha,scope=swu
        cache-to: type=gha,scope=swu,mode=max

    - name: Verify all SWU payloads before uploading
      env:
        EXPECTED_VERSION: ${{ github.sha }}
      run: python3 build/verify-swu.py build/dist --expected-version "$EXPECTED_VERSION"

    - name: Upload artifact for K2P, K3
      uses: actions/upload-artifact@v7
      with:
        name: update-k2p-k3
        compression-level: 0
        if-no-files-found: error
        path: |
          build/dist/*-k2p-k3.swu
          build/dist/*-k2p-k3.zip

    - name: Upload artifact for KS1
      uses: actions/upload-artifact@v7
      with:
        name: update-ks1
        compression-level: 0
        if-no-files-found: error
        path: |
          build/dist/*-ks1.swu
          build/dist/*-ks1.zip

    - name: Upload artifact for KS1M
      uses: actions/upload-artifact@v7
      with:
        name: update-ks1m
        compression-level: 0
        if-no-files-found: error
        path: |
          build/dist/*-ks1m.swu
          build/dist/*-ks1m.zip

    - name: Upload artifact for K3M
      uses: actions/upload-artifact@v7
      with:
        name: update-k3m
        compression-level: 0
        if-no-files-found: error
        path: |
          build/dist/*-k3m.swu
          build/dist/*-k3m.zip
